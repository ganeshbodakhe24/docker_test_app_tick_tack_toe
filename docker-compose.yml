version: "3.9"

services:
  react-app:
    image: tic-tac-toe
    container_name: tic-tac-toe-container
    expose:
      - "80"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - react-app
    restart: always